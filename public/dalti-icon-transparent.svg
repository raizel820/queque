<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
    <!-- D-shape chair icon (extracted from full DALTI logo) -->
    <g transform="translate(48, 72) scale(0.82)">
        
        <!-- Left vertical stroke of D (chair back) -->
        <path d="M 0,0 C 30,40 45,80 45,130 L 45,250" 
              fill="none" stroke="#1db29c" stroke-width="40" stroke-linecap="butt" />
        
        <!-- Right curve of D (armrest) -->
        <path d="M 80,0 L 150,0 C 270,0 270,175 150,175 L -30,175" 
              fill="none" stroke="#1db29c" stroke-width="40" stroke-linecap="butt" />
        
        <!-- Chair leg (diagonal stroke) -->
        <path d="M 205,155 L 240,250" 
              fill="none" stroke="#1db29c" stroke-width="40" stroke-linecap="butt" />

        <!-- Orange notification dot -->
        <circle cx="245" cy="-25" r="34" fill="#f2782b" />
        
    </g>
</svg>