<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="180" fill="url(#accent)" opacity="0.3"/>
  <!-- Ticket/Queue icon -->
  <g transform="translate(100, 120)">
    <!-- Main ticket shape -->
    <rect x="0" y="0" width="312" height="272" rx="24" fill="white" opacity="0.95"/>
    <!-- Dashed line separator -->
    <line x1="24" y1="88" x2="288" y2="88" stroke="#059669" stroke-width="3" stroke-dasharray="12 8" opacity="0.5"/>
    <!-- Queue number -->
    <text x="156" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="56" fill="#059669">B-042</text>
    <!-- Agency name -->
    <text x="156" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="36" fill="#0d9488">BLASTI</text>
    <!-- Arabic name -->
    <text x="156" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="30" fill="#059669" opacity="0.8">بلاصتي</text>
    <!-- Decorative dots -->
    <circle cx="40" cy="232" r="8" fill="#059669" opacity="0.4"/>
    <circle cx="64" cy="232" r="8" fill="#0d9488" opacity="0.4"/>
    <circle cx="88" cy="232" r="8" fill="#14b8a6" opacity="0.4"/>
    <!-- Status indicator -->
    <circle cx="272" cy="232" r="12" fill="#10b981"/>
    <circle cx="272" cy="232" r="18" fill="#10b981" opacity="0.3"/>
  </g>
</svg>