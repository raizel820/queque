<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
    <defs>
        <!-- Emerald to teal gradient for the main shape -->
        <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="50%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#14b8a6" />
        </linearGradient>
        <!-- Gradient for the background -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="40%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>
        <!-- Subtle inner shadow -->
        <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
            <feOffset dx="0" dy="2" result="offsetBlur" />
            <feComposite in="SourceGraphic" in2="offsetBlur" operator="over" />
        </filter>
    </defs>

    <!-- Background: emerald-teal gradient rounded square -->
    <rect width="100%" height="100%" fill="url(#bgGradient)" rx="70" />

    <!-- Subtle overlay for depth -->
    <rect width="100%" height="100%" fill="url(#emeraldTeal)" rx="70" opacity="0.15" />

    <!-- D-shape chair icon (extracted from full logo) -->
    <g transform="translate(48, 72) scale(0.82)">
        
        <!-- Left vertical stroke of D (chair back) -->
        <path d="M 0,0 C 30,40 45,80 45,130 L 45,250" 
              fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="butt" />
        
        <!-- White gap for chair seat separation -->
        <path d="M -35,175 L 160,175" 
              fill="none" stroke="url(#bgGradient)" stroke-width="62" />
        
        <!-- Right curve of D (armrest) -->
        <path d="M 80,0 L 150,0 C 270,0 270,175 150,175 L -30,175" 
              fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="butt" />
        
        <!-- Chair leg (diagonal stroke) -->
        <path d="M 205,155 L 240,250" 
              fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="butt" />

        <!-- Orange notification dot -->
        <circle cx="245" cy="-25" r="34" fill="#f97316" />
        <!-- Subtle glow behind dot -->
        <circle cx="245" cy="-25" r="40" fill="#f97316" opacity="0.2" />
        
    </g>
</svg>